<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demonlist</title>
    
    <!-- Заглушка для favicon, чтобы убрать ошибку 404 в консоли -->
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">

    <!-- Подключение файлов стилей -->
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="./css/list.css">

    <!-- Резервные стили на случай проблем с загрузкой внешних CSS -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0e14; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
        
        .gdl-header { background: #111317; border-bottom: 1px solid #222; }
        .header-container { max-width: 1520px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 12px 24px; }
        .nav-links { display: flex; gap: 20px; }
        .nav-item { color: #8a94a6; text-decoration: none; font-weight: 600; font-size: 15px; }
        .nav-item:hover, .nav-item.router-link-active { color: #3b82f6; }
    </style>

    <!-- Vue 3 и Vue Router 4 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.js"></script>
</head>
<body>
    <div id="app">
        <!-- Шапка сайта -->
        <header class="gdl-header">
            <div class="header-container">
                <nav class="nav-links">
                    <router-link to="/" class="nav-item">List</router-link>
                    <router-link to="/leaderboard" class="nav-item">Leaderboard</router-link>
                    <router-link to="/roulette" class="nav-item">Roulette</router-link>
                </nav>

                <!-- Кнопка админки -->
                <button 
                    id="admin-header-btn"
                    onclick="handleAdminLogin()"
                    style="
                        background: linear-gradient(135deg, #e74c3c, #c0392b);
                        color: #ffffff;
                        border: none;
                        padding: 8px 16px;
                        border-radius: 8px;
                        font-weight: 600;
                        font-size: 14px;
                        cursor: pointer;
                        display: inline-flex;
                        align-items: center;
                        gap: 6px;
                        box-shadow: 0 4px 12px rgba(231, 76, 60, 0.25);
                        transition: all 0.2s ease;
                    "
                >
                    <span id="admin-btn-icon">🔒</span>
                    <span id="admin-btn-text">Admin Login</span>
                </button>
            </div>
        </header>

        <!-- Основной контент страницы -->
        <router-view></router-view>
    </div>

    <script>
    function updateHeaderBtnUI() {
        const btn = document.getElementById('admin-header-btn');
        const icon = document.getElementById('admin-btn-icon');
        const text = document.getElementById('admin-btn-text');
        if (!btn) return;
        
        const isAdmin = sessionStorage.getItem('is_admin') === 'true';

        if (isAdmin) {
            btn.style.background = 'linear-gradient(135deg, #2ecc71, #27ae60)';
            btn.style.boxShadow = '0 4px 12px rgba(46, 204, 113, 0.25)';
            icon.textContent = '⚡';
            text.textContent = 'Админ (Выйти)';
        } else {
            btn.style.background = 'linear-gradient(135deg, #e74c3c, #c0392b)';
            btn.style.boxShadow = '0 4px 12px rgba(231, 76, 60, 0.25)';
            icon.textContent = '🔒';
            text.textContent = 'Admin Login';
        }
    }

    function handleAdminLogin() {
        const isAdmin = sessionStorage.getItem('is_admin') === 'true';
        if (isAdmin) {
            if (confirm("Выйти из админки?")) {
                sessionStorage.removeItem('is_admin');
                updateHeaderBtnUI();
                window.dispatchEvent(new Event('admin-state-changed'));
            }
        } else {
            const pass = prompt("Введите пароль админа:");
            if (pass === "29564329981") {
                let token = localStorage.getItem("my_gh_token");
                if (!token) {
                    token = prompt("Введите ваш GitHub Token (сохранится в браузере):");
                    if (token) {
                        localStorage.setItem("my_gh_token", token.trim());
                    } else {
                        alert("Без токена нельзя сохранять!");
                        return;
                    }
                }
                sessionStorage.setItem('is_admin', 'true');
                updateHeaderBtnUI();
                window.dispatchEvent(new Event('admin-state-changed'));
            } else if (pass !== null) {
                alert("Неверный пароль!");
            }
        }
    }

    document.addEventListener("DOMContentLoaded", updateHeaderBtnUI);
    </script>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
